# Nginx/OpenServer: myblog.loc
# Корень проекта: E:/OSPanel/www-html/myblog.loc
# В OpenServer замените пути сертификата и при необходимости порт PHP-FPM.
# Конфигурация намеренно обслуживает и HTTP, и HTTPS без принудительного редиректа.

upstream myblog_php {
    server 127.0.0.1:9000;
}

server {
    listen 80;
    server_name myblog.loc www.myblog.loc;
    root E:/OSPanel/www-html/myblog.loc/public;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass myblog_php;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTPS $https if_not_empty;
    }

    location ~* \.(?:css|js|mjs|jpg|jpeg|png|gif|svg|webp|ico|woff|woff2|ttf|otf|map)$ {
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    location ~ /\. {
        deny all;
    }
}

server {
    listen 443 ssl;
    server_name myblog.loc www.myblog.loc;
    root E:/OSPanel/www-html/myblog.loc/public;
    index index.php index.html;

    # Укажите реальные сертификаты домена OpenServer.
    ssl_certificate     E:/OSPanel/userdata/config/certs/myblog.loc.crt;
    ssl_certificate_key E:/OSPanel/userdata/config/certs/myblog.loc.key;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass myblog_php;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTPS on;
    }

    location ~* \.(?:css|js|mjs|jpg|jpeg|png|gif|svg|webp|ico|woff|woff2|ttf|otf|map)$ {
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    location ~ /\. {
        deny all;
    }
}
