name: PHPUnit Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  phpunit:
    name: PHPUnit (SQLite :memory:)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo, pdo_sqlite, json, dom, xml, ctype, fileinfo, sqlite3
          ini-values: memory_limit=512M
          coverage: xdebug
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-progress --no-interaction --prefer-dist --optimize-autoloader

      - name: Create test environment file
        run: |
          cp .env.example .env.testing 2>/dev/null || echo "APP_ENV=testing" > .env.testing
          echo "DB_CONNECTION=sqlite" >> .env.testing
          echo "DB_DATABASE=:memory:" >> .env.testing
          echo "DB_PREFIX=va_" >> .env.testing

      - name: Run PHPUnit
        run: vendor/bin/phpunit --configuration phpunit.xml.dist --coverage-clover=build/logs/clover.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-coverage
          path: build/coverage
          retention-days: 7

      - name: Upload clover.xml
        uses: actions/upload-artifact@v4
        with:
          name: clover-xml
          path: build/logs/clover.xml
          retention-days: 7