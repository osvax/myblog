name: Playwright E2E

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  playwright:
    name: Playwright E2E (Smoke Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: myblog_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo, pdo_mysql, json, dom, xml, ctype, fileinfo, gd
          ini-values: memory_limit=512M
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-progress --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Create test environment
        run: |
          cp .env.example .env.testing 2>/dev/null || true
          cat > .env.testing << 'EOF'
          APP_ENV=testing
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=myblog_test
          DB_USERNAME=test
          DB_PASSWORD=test
          DB_PREFIX=va_
          SMTP_ENABLED=false
          EOF

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -u root -proot --silent; then
              echo "MySQL is ready"
              break
            fi
            sleep 2
          done

      - name: Run migrations
        run: |
          php database/migrate.php up
        env:
          APP_ROOT: ${{ github.workspace }}

      - name: Start PHP built-in server
        run: |
          php -S 127.0.0.1:8000 -t public &
          sleep 3
          curl -f http://127.0.0.1:8000/ || exit 1

      - name: Run Playwright tests
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: test-results
          retention-days: 7